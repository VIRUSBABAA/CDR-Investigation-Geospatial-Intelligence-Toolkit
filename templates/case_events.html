{% extends "base.html" %}
{% block title %}Event log · {{ case.name }}{% endblock %}
{% block content %}
<div class="content-wide">
<header class="page-head">
  <div>
    <a href="{{ url_for('case_map', case_id=case.id) }}" class="breadcrumb">← Trail map · {{ case.name }}</a>
    <h1>Full event log</h1>
    <p class="page-sub">Advanced filters, search, and full event intelligence.</p>
  </div>
  <div class="page-actions">
    <a href="{{ url_for('export_csv', case_id=case.id) }}" class="btn-ghost small">Export CSV</a>
  </div>
</header>

<div class="events-toolbar panel">
  <div class="filter-chips" id="filter-chips">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="incoming">↓ Incoming</button>
    <button class="chip" data-filter="outgoing">↑ Outgoing</button>
    <button class="chip" data-filter="missed">✕ Missed</button>
    <button class="chip" data-filter="sms">✉ Message</button>
    <button class="chip chip-danger" data-filter="jump">⚡ Jump</button>
  </div>
  <input type="search" id="event-search" class="event-search-input" placeholder="Search number, cell ID, address, IMEI…">

  <div class="adv-filters">
    <div class="filter-group">
      <label>Date from</label>
      <input type="date" id="adv-date-from">
    </div>
    <div class="filter-group">
      <label>Date to</label>
      <input type="date" id="adv-date-to">
    </div>
    <div class="filter-group">
      <label>Time from</label>
      <input type="time" id="adv-time-from" value="00:00">
    </div>
    <div class="filter-group">
      <label>Time to</label>
      <input type="time" id="adv-time-to" value="23:59">
    </div>
    <div class="filter-group">
      <label>Min duration (sec)</label>
      <input type="number" id="adv-dur-min" min="0" placeholder="0">
    </div>
    <div class="filter-group">
      <label>Max duration (sec)</label>
      <input type="number" id="adv-dur-max" min="0" placeholder="any">
    </div>
    <div class="filter-group">
      <label>Cell ID</label>
      <input type="text" id="adv-cell-id" placeholder="partial match">
    </div>
    <div class="filter-group">
      <label>IMEI</label>
      <input type="text" id="adv-imei" placeholder="partial match">
    </div>
    <div class="filter-group">
      <label>IMSI</label>
      <input type="text" id="adv-imsi" placeholder="partial match">
    </div>
    <div class="filter-group" style="justify-content:flex-end">
      <label class="toggle-check"><input type="checkbox" id="adv-jumps-only"> Jumps only</label>
      <label class="toggle-check"><input type="checkbox" id="adv-night-only"> Night only (21–06)</label>
      <label class="toggle-check"><input type="checkbox" id="adv-device-change"> IMEI/IMSI change</label>
      <label class="toggle-check"><input type="checkbox" id="adv-operator-handoff"> Operator handoff</label>
    </div>
    <div class="filter-actions">
      <button type="button" class="btn-ghost small" id="adv-reset">Reset filters</button>
    </div>
  </div>
  <div class="events-summary" id="events-summary"></div>
</div>

<div class="panel events-table-panel">
  <div class="events-table-wrap">
    <table class="data-table events-table" id="events-table">
      <thead>
        <tr>
          <th>#</th><th>Type</th><th>Timestamp</th><th>Contact</th><th>Duration</th>
          <th>Location</th><th>Cell ID</th><th>Distance</th><th>Speed</th><th>Dwell</th><th></th>
        </tr>
      </thead>
      <tbody id="events-tbody"></tbody>
    </table>
  </div>
</div>

<script>
  const CASE_ID = {{ case.id }};
  const API_URL = "{{ url_for('api_records', case_id=case.id) }}";
  const INITIAL_FILTER = new URLSearchParams(window.location.search).get('type') || 'all';
</script>
<script src="{{ url_for('static', filename='js/cdr-utils.js') }}"></script>
<script src="{{ url_for('static', filename='js/events.js') }}"></script>
</div>
{% endblock %}
